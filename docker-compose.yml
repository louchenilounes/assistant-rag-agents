name: assistant-rag

services:
  ollama:
    image: ollama/ollama:0.40.9
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  models:
    image: ollama/ollama:0.40.9
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["sh", "-c", "ollama pull ${LLM_MODEL:-qwen3:4b-instruct} && ollama pull ${EMBED_MODEL:-bge-m3}"]
    depends_on:
      ollama:
        condition: service_healthy

  api:
    build: .
    command: ["sh", "-c", "python scripts/build_index.py && uvicorn assistant_rag.api:app --host 0.0.0.0 --port 8000"]
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b-instruct}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
    volumes:
      - index:/app/storage
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 30m
      retries: 5
    depends_on:
      models:
        condition: service_completed_successfully

  app:
    build: .
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  ollama:
  index:
