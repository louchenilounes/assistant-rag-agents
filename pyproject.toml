[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant-rag"
version = "0.6.0"
description = "Assistant multi-agents de questions-réponses sur documents avec citation des sources"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "pandas>=2.0",
    "llama-index-core>=0.14,<0.15",
    "llama-index-llms-ollama>=0.11,<0.12",
    "llama-index-embeddings-ollama>=0.10,<0.11",
    "langgraph>=1.2,<2",
    "mlflow>=3.0,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:The ``noload`` loader strategy is deprecated:DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
